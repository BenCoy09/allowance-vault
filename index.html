<style>
/* Layout concept: one dark product shell. Marketing pages are open, centered-left editorial sections;
   the app is a sidebar + work area; docs are a three-column reading layout. */
:root {
  --bg: #101311;
  --surface: #10122000;
  --surface-1: #171b18;
  --surface-2: #1d221e;
  --line: #2b322c;
  --line-soft: #222823;
  --fg: #ece8dc;
  --muted: #8f968a;
  --violet: #d9a441;
  --violet-soft: #d9a44124;
  --cyan: #9fb7c4;
  --cyan-soft: #9fb7c41f;
  --ok: #3ddc97;
  --ok-soft: #3ddc971f;
  --bad: #ff6b57;
  --bad-soft: #ff6b5722;
  --warn: #ffb454;
  --warn-soft: #ffb45422;
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --pad: 16px;
  --density: 1;
  --radius: 10px;
  color-scheme: dark;
}
:root[data-density="compact"] { --density: 0.78; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  margin: 0;
  min-height: 100%;
  overflow-x: hidden;
}
:root[data-motion="reduce"] html, :root[data-motion="reduce"] * { scroll-behavior: auto; }
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"]) *, :root:not([data-motion="full"]) *::before, :root:not([data-motion="full"]) *::after {
    animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important;
  }
}
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after {
  animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.55; }
#root { position: relative; z-index: 1; }
a { color: var(--cyan); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: #cfe0e8; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.015em; line-height: 1.12; margin: 0; text-wrap: balance; font-weight: 700; }
h1 { font-size: clamp(2.2rem, 5.4vw, 4rem); }
h2 { font-size: clamp(1.55rem, 3vw, 2.2rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; max-width: 66ch; }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.86em; }
:not(pre) > code { background: var(--surface-2); border: 1px solid var(--line-soft); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--violet); color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 100; }
.skip:focus { left: 8px; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; }

/* ---------- buttons, pills, fields ---------- */
.btn {
  appearance: none; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  padding: calc(10px * var(--density)) 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { border-color: #454d45; background: #252b26; color: var(--fg); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #d9a441, #c4912f); border-color: #e8c777; color: #fff; }
.btn.primary:hover { background: linear-gradient(180deg, #e4b556, #d9a441); color: #fff; }
.btn.danger { border-color: #7a3a33; background: var(--bad-soft); color: #ffb4a8; }
.btn.danger:hover { background: #ff6b5733; color: #ffd0c8; }
.btn.small { padding: 5px 10px; font-size: 0.85rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: #3ddc9744; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: #ff6b5744; }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: #ffb45444; }
.pill.info { color: var(--cyan); background: var(--cyan-soft); border-color: #9fb7c444; }
.pill.violet { color: #e8c777; background: var(--violet-soft); border-color: #d9a44155; }
.pill.plain::before { display: none; }
label.field, .field { display: grid; gap: 6px; font-weight: 600; font-size: 0.9rem; }
.field small { font-weight: 400; color: var(--muted); }
.field .err { color: var(--bad); font-weight: 500; font-size: 0.85rem; min-height: 1.1em; }
input, select, textarea {
  font: inherit; color: var(--fg); background: #131714; border: 1px solid var(--line); border-radius: 8px; padding: calc(9px * var(--density)) 12px; width: 100%; min-width: 0;
}
input:hover, select:hover, textarea:hover { border-color: #454d45; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--violet); }
textarea { min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: 0.86rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .grid2, .grid4 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); padding: calc(18px * var(--density)) 20px; min-width: 0; }
.panel.flat { background: transparent; }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--cyan); background: var(--cyan-soft); padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.callout strong { color: var(--fg); }

/* ---------- site header / footer ---------- */
.site-head { position: sticky; top: 0; z-index: 40; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: #101311d9; backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
.site-head .wrap { display: flex; align-items: center; gap: 20px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; letter-spacing: -0.01em; }
.brand:hover { color: var(--fg); }
.brand svg { width: 30px; height: 30px; flex: none; }
.nav { display: flex; gap: 4px; flex: 1; align-items: center; }
.nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 7px; font-weight: 500; font-size: 0.93rem; }
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.menu-btn { display: none; }
@media (max-width: 860px) {
  .menu-btn { display: inline-flex; margin-left: auto; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; background: #131714; border-bottom: 1px solid var(--line); padding: 8px 16px 14px; }
  .nav.open { display: flex; }
  .head-cta { display: none; }
}
.site-foot { border-top: 1px solid var(--line-soft); margin-top: 90px; padding-block: 40px 56px; color: var(--muted); font-size: 0.9rem; }
.site-foot .cols { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 28px; }
.site-foot h4 { font-size: 0.9rem; color: var(--fg); margin-bottom: 10px; font-family: var(--font-body); }
.site-foot a { display: block; color: var(--muted); text-decoration: none; padding: 2px 0; }
.site-foot a:hover { color: var(--fg); }
@media (max-width: 760px) { .site-foot .cols { grid-template-columns: 1fr 1fr; } }

/* ---------- landing ---------- */
.hero { padding-block: clamp(36px, 7vw, 84px) 36px; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 36px; align-items: center; }
@media (max-width: 980px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero h1 .l2 { color: #e8c777; display: block; }
.hero p.lead { font-size: 1.13rem; color: #cfcbbd; margin-top: 18px; }
.hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.status-line { display: inline-flex; gap: 10px; align-items: center; padding: 6px 12px; border: 1px solid #ffb45455; background: var(--warn-soft); border-radius: 99px; color: #f0d9a0; font-size: 0.82rem; margin-bottom: 22px; flex-wrap: wrap; }
.status-line b { font-family: var(--font-mono); font-weight: 600; }
.viz { background: linear-gradient(180deg, #171c18, #131714); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: 0 0 0 1px #d9a44114, 0 30px 80px -30px #d9a44140; min-width: 0; }
.viz svg { width: 100%; height: auto; display: block; }
.viz .caption { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); padding: 10px 6px 2px; }
.section { padding-block: clamp(44px, 7vw, 84px) 0; }
.section > .wrap > h2 { margin-bottom: 14px; }
.section > .wrap > p.sub { color: var(--muted); font-size: 1.05rem; margin-bottom: 30px; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 28px; }
@media (max-width: 760px) { .compare { grid-template-columns: minmax(0, 1fr); } }
.compare .panel h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.compare ul { margin: 12px 0 0; padding-left: 18px; color: #cfcbbd; }
.compare li { margin: 4px 0; }
.steps { counter-reset: step; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.steps .panel { position: relative; }
.steps .panel::before { counter-increment: step; content: counter(step); position: absolute; top: 14px; right: 16px; font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: #d9a44140; }
.steps .panel h3 { margin-bottom: 8px; padding-right: 28px; }
.steps .panel p { color: var(--muted); font-size: 0.94rem; }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.feat .panel h3 { margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.feat .panel p { color: var(--muted); font-size: 0.93rem; }
.cta-band { margin-top: 90px; padding: clamp(28px, 5vw, 56px); border: 1px solid #d9a44155; border-radius: 18px; background: radial-gradient(120% 140% at 0% 0%, #d9a44130, transparent 60%), var(--surface-1); display: grid; gap: 18px; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.side { border-right: 1px solid var(--line-soft); background: #121613ee; padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.side .brand { padding: 4px 8px 16px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: calc(8px * var(--density)) 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.side nav a:hover { background: var(--surface-2); color: var(--fg); }
.side nav a[aria-current="page"] { background: var(--violet-soft); color: #f0d9a0; }
.side nav .grp { font-size: 0.74rem; color: #79806f; margin: 16px 10px 6px; font-weight: 600; letter-spacing: 0.04em; }
.side nav svg { width: 17px; height: 17px; flex: none; }
.work { min-width: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; gap: 12px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; position: sticky; top: 0; background: #101311ea; backdrop-filter: blur(8px); z-index: 30; }
.topbar .crumbs { color: var(--muted); font-size: 0.9rem; margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.topbar .crumbs a { color: var(--muted); text-decoration: none; }
.topbar .crumbs b { color: var(--fg); font-weight: 600; }
.main { padding: calc(26px * var(--density)) 24px 80px; display: grid; gap: calc(22px * var(--density)); max-width: 1100px; }
.main > header h1 { font-size: clamp(1.6rem, 3.2vw, 2.1rem); }
.main > header p { color: var(--muted); margin-top: 6px; }
.sim-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 14px; border: 1px dashed #ffb45477; background: var(--warn-soft); border-radius: 9px; color: #f0d9a0; font-size: 0.88rem; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line-soft); padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
  .side nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .side nav .grp { display: none; }
  .side nav a { white-space: nowrap; }
  .topbar { padding: 10px 16px; position: static; }
  .main { padding: 20px 16px 60px; }
}
.metric { display: grid; gap: 2px; }
.metric .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.metric .k { color: var(--muted); font-size: 0.84rem; }
.vcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.vcard { display: grid; gap: 14px; }
.vcard header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.vcard h3 { font-size: 1.1rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: #131714; border: 1px solid var(--line-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--cyan)); border-radius: 99px; transition: width 0.4s ease; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: calc(10px * var(--density)) 14px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
td.wrapc { white-space: normal; min-width: 180px; }
th { color: var(--muted); font-weight: 600; font-size: 0.8rem; background: #151a16; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stepper { display: flex; gap: 8px; flex-wrap: wrap; }
.stepper span { padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
.stepper span.on { color: #f0d9a0; border-color: #d9a44188; background: var(--violet-soft); }
.stepper span.done { color: var(--ok); border-color: #3ddc9755; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); display: grid; gap: 10px; justify-items: center; }

/* ---------- security lab ---------- */
.lab { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 980px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.attacks { display: grid; gap: 8px; }
.attack { display: grid; gap: 4px; text-align: left; width: 100%; cursor: pointer; font: inherit; color: var(--fg); background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; transition: border-color 0.15s, background 0.15s; }
.attack:hover { border-color: #8a6d2c; background: #15183000; background: #1b201c; }
.attack[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-soft); }
.attack b { font-family: var(--font-display); font-size: 0.98rem; }
.attack span { color: var(--muted); font-size: 0.85rem; }
.verdict { display: grid; gap: 10px; }
.verdict .big { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 12px; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; border: 1px solid; }
.verdict .big.rej { color: #ffb4a8; background: var(--bad-soft); border-color: #ff6b5755; animation: shake 0.45s ease; }
.verdict .big.acc { color: #a4f3cf; background: var(--ok-soft); border-color: #3ddc9755; animation: pop 0.35s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pop { 0% { transform: scale(0.97); } 100% { transform: scale(1); } }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border: 1px solid var(--line-soft); border-radius: 8px; background: #131714; font-size: 0.9rem; }
.checks li.fail { border-color: #ff6b5744; background: #2a1416; }
.checks li .ic { font-weight: 800; }
.checks li.pass .ic { color: var(--ok); }
.checks li.fail .ic { color: var(--bad); }
.checks li small { color: var(--muted); display: block; }
.steplog { margin: 0; padding-left: 20px; color: #cfcbbd; font-size: 0.9rem; }
.chainbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- activity ---------- */
.drawer { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-1); padding: 16px 18px; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; background: #050706c0; padding: 16px; }
#modal.open { display: flex; }
#modal .box { width: 100%; max-width: 460px; background: #171c18; border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 30px 90px #000a; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #1d221e; border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 95; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }

/* ---------- docs ---------- */
.docs { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 36px; padding-top: 30px; align-items: start; }
@media (max-width: 860px) { .docs { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.docs aside { position: sticky; top: 70px; display: grid; gap: 12px; }
@media (max-width: 860px) { .docs aside { position: static; } }
.docs aside nav { display: grid; gap: 2px; }
.docs aside nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 7px; font-size: 0.92rem; }

<canvas id="bg" aria-hidden="true"></canvas>
<div id="root"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Allowance Vault reference model.
   This is a JavaScript model of the rules in the PLANNED covenant. It is not the covenant, it does not
   touch any blockchain, and a result from it is a simulation. */
const AV = (() => {
  const PAYEES = {
    "payee-a": { label: "Payee A (example)", allowed: true },
    "payee-b": { label: "Payee B (example)", allowed: true },
    "stranger": { label: "Unlisted address (example)", allowed: false },
    "attacker": { label: "Attacker address (example)", allowed: false },
  };

  function newVault(over) {
    return Object.assign({
      id: "demo",
      name: "Demo vault",
      network: "simulation",
      balance: 500000,           // sats held by the vault UTXO
      perTxCap: 40000,           // sats per payment
      bucketCap: 100000,         // sats, maximum the bucket can hold
      refillPerBlock: 500,       // sats added per block
      maxFee: 2000,              // sats, maximum miner fee per spend
      expiryHeight: 901008,      // block height
      allowlist: ["payee-a", "payee-b"],
      bucket: 100000,
      lastHeight: 900000,
      status: "active",          // active | revoked | expired
      agent: "agent-key-1",
    }, over || {});
  }

  function refilled(v, h) {
    return Math.min(v.bucketCap, v.bucket + v.refillPerBlock * Math.max(0, h - v.lastHeight));
  }

  /* tx = { signer, inputs, outputs:[{lock,value,token}], locktime, sequenceFinal, newHeight }
     Evaluates every condition (the real script stops at the first failure) and reports each. */
  function evaluate(v, tx) {
    const out0 = tx.outputs[0] || { lock: "?", value: 0 };
    const out1 = tx.outputs[1] || { lock: "?", value: 0 };
    const amount = out0.value;
    const fee = v.balance - (out0.value || 0) - (out1.value || 0);
    const live = v.status === "active";
    const refill = refilled(v, tx.newHeight);
    const checks = [];
    const add = (id, label, pass, detail) => checks.push({ id, label, pass: !!pass, detail });

    add("live", "Vault UTXO is unspent", live,
      live ? "The vault is active." : v.status === "revoked"
        ? "The owner swept this vault. Its UTXO is spent, so this transaction has nothing to spend."
        : "The vault has expired.");
    add("sig", "Signed by the agent key", tx.signer === "agent",
      tx.signer === "agent" ? "Signature matches the agent key in the contract." : "Only the agent key (or owner path) can unlock this vault.");
    add("shape", "Exactly 1 input and 2 outputs", tx.inputs === 1 && tx.outputs.length === 2,
      "Got " + tx.inputs + " input(s) and " + tx.outputs.length + " output(s). Extra outputs could carry hidden value or tokens.");
    add("tokens", "Payment output carries no tokens", !out0.token,
      out0.token ? "Output 0 holds a token. The contract requires token category 0x." : "No tokens on the payment output.");
    add("timelock", "Locktime is enforced (CLTV) and covers the claimed height",
      !tx.sequenceFinal && tx.locktime >= tx.newHeight,
      tx.sequenceFinal ? "Input sequence is final, so nLockTime is ignored. The contract's tx.time check requires a non-final sequence."
        : tx.locktime < tx.newHeight ? "Claimed height " + tx.newHeight + " is above locktime " + tx.locktime + "." : "Locktime " + tx.locktime + " covers claimed height " + tx.newHeight + ".");
    add("monotone", "Height does not go backwards", tx.newHeight >= v.lastHeight,
      "Claimed height " + tx.newHeight + ", last recorded height " + v.lastHeight + ".");
    add("expiry", "Vault has not expired", tx.newHeight < v.expiryHeight,
      "Height " + tx.newHeight + ", expiry height " + v.expiryHeight + ".");
    add("payee", "Recipient is on the approved list", v.allowlist.includes(out0.lock),
      (PAYEES[out0.lock] ? PAYEES[out0.lock].label : out0.lock) + (v.allowlist.includes(out0.lock) ? " is approved." : " is not approved."));
    add("cap", "Amount is within the per-payment cap", amount <= v.perTxCap,
      fmt(amount) + " requested, cap " + fmt(v.perTxCap) + ".");
    add("change", "Change returns to the same vault with its state token", out1.lock === "vault" && out1.keepsNft !== false,
      out1.lock === "vault" ? "Change goes back to the vault." : "Output 1 goes to " + (PAYEES[out1.lock] ? PAYEES[out1.lock].label : out1.lock) + ". The contract requires the vault's own locking script.");
    add("fee", "Miner fee is within the fee cap", fee >= 0 && fee <= v.maxFee,
      "Fee " + fmt(fee) + ", cap " + fmt(v.maxFee) + ". The fee is computed from inputs minus outputs, so it cannot be hidden.");
    add("bucket", "Amount plus fee fits the budget", amount + fee <= refill,
      "Needs " + fmt(amount + fee) + ", budget available " + fmt(refill) + " (bucket " + fmt(v.bucket) + " refilling " + fmt(v.refillPerBlock) + " per block, capped at " + fmt(v.bucketCap) + ").");

    const failed = checks.filter(c => !c.pass);
    return { checks, accepted: failed.length === 0, firstFail: failed[0] || null, fee, refill };
  }

  function apply(v, tx, result) {
    if (!result.accepted) return v;
    const amount = tx.outputs[0].value;
    v.bucket = result.refill - amount - result.fee;
    v.lastHeight = tx.newHeight;
    v.balance = v.balance - amount - result.fee;
    return v;
  }

  function ownerSweep(v) {
    v.status = "revoked";
    return { accepted: true, note: "Owner path: one input, owner signature, any outputs. No other rule applies." };
  }

  function fmt(sats) {
    const bch = sats / 1e8;
    return sats.toLocaleString("en-US") + " sats (" + bch.toFixed(8).replace(/0+$/, "").replace(/\.$/, ".0") + " BCH)";
  }
  function fmtShort(sats) { return sats.toLocaleString("en-US") + " sats"; }

  /* legitimate baseline transaction against a vault */
  function legit(v, over) {
    const height = v.lastHeight + 1;
    const amount = 20000, fee = 1000;
    const tx = {
      signer: "agent", inputs: 1,
      outputs: [{ lock: "payee-a", value: amount, token: false }, { lock: "vault", value: v.balance - amount - fee, keepsNft: true }],
      locktime: height, sequenceFinal: false, newHeight: height,
    };
    return Object.assign(tx, over || {});
  }

  function mk(v, amount, fee, lock, extra) {
    const height = (extra && extra.newHeight) || v.lastHeight + 1;
    const tx = {
      signer: "agent", inputs: 1,
      outputs: [{ lock: lock, value: amount, token: false }, { lock: "vault", value: v.balance - amount - fee, keepsNft: true }],
      locktime: height, sequenceFinal: false, newHeight: height,
    };
    return Object.assign(tx, extra || {});
  }

  /* Attack catalogue. Each run() starts from a fresh vault and returns steps. */
  const ATTACKS = [
    {
      id: "a01", name: "Attack 01: Transaction cap bypass", short: "Send 200,000 sats in one payment to an approved payee.",
      expect: "The per-payment cap is 40,000 sats, so the covenant rejects it.",
      run() {
        const v = newVault();
        const tx = mk(v, 200000, 1000, "payee-a");
        return { vault: v, steps: [{ label: "Agent key signs a 200,000 sat payment to Payee A", tx, res: evaluate(v, tx) }] };
      },
    },
    {
      id: "a02", name: "Attack 02: Unauthorized recipient", short: "Pay a small, within-cap amount to an address that is not approved.",
      expect: "The recipient is not on the approved list, so the covenant rejects it.",
      run() {
        const v = newVault();
        const tx = mk(v, 10000, 1000, "attacker");
        return { vault: v, steps: [{ label: "Agent key signs a 10,000 sat payment to the attacker address", tx, res: evaluate(v, tx) }] };
      },
    },
    {
      id: "a03", name: "Attack 03: Budget exhaustion", short: "Split spending into many payments inside the same block range.",
      expect: "Each payment is inside the cap, but the budget is shared. The third one is rejected.",
      run() {
        const v = newVault();
        const steps = [];
        for (let i = 1; i <= 3; i++) {
          const tx = mk(v, 40000, 1000, "payee-a", { newHeight: v.lastHeight, locktime: v.lastHeight });
          const res = evaluate(v, tx);
          steps.push({ label: "Payment " + i + " of 40,000 sats to Payee A", tx, res });
          apply(v, tx, res);
          if (!res.accepted) break;
        }
        return { vault: v, steps };
      },
    },
    {
      id: "a04", name: "Attack 04: Expired authorization", short: "Spend after the vault's expiry height.",
      expect: "The vault has expired, so the agent path is closed. Anyone can send the funds to the owner's refund address.",
      run() {
        const v = newVault();
        const h = v.expiryHeight + 5;
        const tx = mk(v, 10000, 1000, "payee-a", { newHeight: h, locktime: h });
        return { vault: v, steps: [{ label: "Agent key signs a 10,000 sat payment at height " + h, tx, res: evaluate(v, tx) }] };
      },
    },
    {
      id: "a05", name: "Attack 05: Revoked agent", short: "Owner revokes, then the agent tries a normal payment.",
      expect: "Revocation spends the vault UTXO. The agent's later transaction has nothing to spend.",
      run() {
        const v = newVault();
        const steps = [];
        const sweep = ownerSweep(v);
        steps.push({ label: "Owner signs a sweep (revocation)", owner: true, res: { accepted: true, checks: [{ id: "owner", label: "Owner signature", pass: true, detail: sweep.note }], firstFail: null } });
        const tx = mk(v, 10000, 1000, "payee-a");
        steps.push({ label: "Agent key signs a 10,000 sat payment to Payee A", tx, res: evaluate(v, tx) });
        return { vault: v, steps };
      },
    },
    {
      id: "a06", name: "Attack 06: Redirect the change", short: "Send the remainder of the vault to the attacker instead of back to the vault.",
      expect: "Output 1 must use the vault's own locking script, so the covenant rejects it.",
      run() {
        const v = newVault();
        const tx = mk(v, 10000, 1000, "payee-a");
        tx.outputs[1] = { lock: "attacker", value: v.balance - 10000 - 1000, keepsNft: false };
        return { vault: v, steps: [{ label: "Agent key signs a payment whose change goes to the attacker", tx, res: evaluate(v, tx) }] };
      },
    },
    {
      id: "a07", name: "Attack 07: Fee inflation", short: "Pay a huge miner fee to move value out through a cooperating miner.",
      expect: "The fee is inputs minus outputs and is capped at 2,000 sats, so the covenant rejects it.",
      run() {
        const v = newVault();
        const tx = mk(v, 10000, 30000, "payee-a");
        return { vault: v, steps: [{ label: "Agent key signs a payment with a 30,000 sat fee", tx, res: evaluate(v, tx) }] };
      },
    },
    {
      id: "a08", name: "Attack 08: Forge the clock", short: "Claim a far-future height with a final input sequence to mint a full budget.",
      expect: "A final sequence disables locktime, so the contract's time check fails.",
      run() {
        const v = newVault({ bucket: 0 });
        const tx = mk(v, 30000, 1000, "payee-a", { newHeight: v.lastHeight + 400, locktime: 0, sequenceFinal: true });
        return { vault: v, steps: [{ label: "Agent key signs with a final sequence, claiming 400 blocks of refill", tx, res: evaluate(v, tx) }] };
      },
    },
    {
      id: "a09", name: "Attack 09: Extra token output", short: "Attach a token to the payment output.",
      expect: "The payment output must hold no tokens, so the covenant rejects it.",
      run() {
        const v = newVault();
        const tx = mk(v, 10000, 1000, "payee-a");
        tx.outputs[0].token = true;
        return { vault: v, steps: [{ label: "Agent key signs a payment whose output carries a token", tx, res: evaluate(v, tx) }] };
      },
    },
  ];

  const CONTRACT_DRAFT = `// Compiles with cashc 0.14.0. Nine test cases pass in a local VM emulator (see TESTS.md).
// Not deployed on any chain. Not audited.
pragma cashscript ^0.14.0;

contract AllowanceVault(
    bytes20 ownerPkh,
    pubkey agentPk,
    bytes allowedLock1,
    bytes allowedLock2,
    int perTxCap,
    int bucketCap,
    int refillPerBlock,
    int maxFee,
    int expiryHeight,
    bytes refundLock
) {
    // Agent path: one payment, vault continues with updated state.
    function agentSpend(sig agentSig, int amount, int newHeight) {
        require(checkSig(agentSig, agentPk));
        require(tx.inputs.length == 1);
        require(tx.outputs.length == 2);
        require(tx.time >= newHeight);          // forces a non-final sequence (CLTV)

        bytes state = tx.inputs[this.activeInputIndex].nftCommitment;
        bytes bucketBytes, bytes heightBytes = state.split(8);
        int bucket = int(bucketBytes);
        int lastHeight = int(heightBytes);
        require(newHeight >= lastHeight);
        require(newHeight < expiryHeight);

        bytes payee = tx.outputs[0].lockingBytecode;
        require(payee == allowedLock1 || payee == allowedLock2);
        require(tx.outputs[0].tokenCategory == 0x);
        require(tx.outputs[0].value == amount);
        require(amount <= perTxCap);

        require(tx.outputs[1].lockingBytecode == tx.inputs[this.activeInputIndex].lockingBytecode);
        require(tx.outputs[1].tokenCategory == tx.inputs[this.activeInputIndex].tokenCategory);

        int fee = tx.inputs[this.activeInputIndex].value - tx.outputs[0].value - tx.outputs[1].value;
        require(fee >= 0 && fee <= maxFee);

        int refilled = min(bucketCap, bucket + refillPerBlock * (newHeight - lastHeight));
        require(amount + fee <= refilled);
        int newBucket = refilled - amount - fee;
        require(tx.outputs[1].nftCommitment == toPaddedBytes(newBucket, 8) + toPaddedBytes(newHeight, 8));
    }

    // Owner path: revoke or withdraw at any time. No agent cooperation needed.
    function ownerSweep(pubkey ownerPk, sig ownerSig) {
        require(hash160(ownerPk) == ownerPkh);
        require(checkSig(ownerSig, ownerPk));
    }

    // After expiry anyone may return the funds to the owner's refund address.
    function expiredReclaim() {
        require(tx.time >= expiryHeight);
        require(tx.outputs.length == 1);
        require(tx.outputs[0].lockingBytecode == refundLock);
        require(tx.outputs[0].value >= tx.inputs[this.activeInputIndex].value - maxFee);
    }
}`;

  return { PAYEES, newVault, refilled, evaluate, apply, ownerSweep, legit, mk, ATTACKS, CONTRACT_DRAFT, fmt, fmtShort };
})();
if (typeof module !== "undefined") module.exports = AV;

"use strict";
/* ============ utilities, state, logo, background, router ============ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "av.v1";
const S = {
  prefs: { density: "comfortable", motion: "system", bg: true, confirmRevoke: true, hideAmounts: false, labDetail: true },
  vaults: [], agents: [], log: [], session: null,
};
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || "null");
    if (j) { Object.assign(S.prefs, j.prefs || {}); S.vaults = j.vaults || []; S.agents = j.agents || []; }
  } catch (e) { /* storage unavailable: run without it */ }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ prefs: S.prefs, vaults: S.vaults, agents: S.agents })); } catch (e) { /* ignore */ } }
function resetSession(params) { S.session = AV.newVault(Object.assign({ name: "Demo vault" }, params || {})); }
resetSession();

const sats = n => S.prefs.hideAmounts ? "•••• sats" : AV.fmtShort(n);
const satsFull = n => S.prefs.hideAmounts ? "•••• sats" : AV.fmt(n);
const pill = (kind, text) => '<span class="pill ' + kind + '">' + esc(text) + "</span>";
const STATUS = {
  implemented: () => pill("ok", "Implemented"), simulated: () => pill("info", "Simulated"),
  planned: () => pill("violet", "Planned"), unverified: () => pill("warn", "Unverified"),
};
const stamp = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

/* ---------- icons ---------- */
const ICONS = {
  home: "M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
  vault: "M12 2l8 4.5v9L12 20l-8-4.5v-9z M12 9v4",

/* ---------- motion + background ---------- */
function motionOn() {
  const m = S.prefs.motion;
  if (m === "reduce") return false;
  if (m === "full") return true;
  try { return !matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return true; }
}
function applyPrefs() {
  const r = document.documentElement;
  r.setAttribute("data-density", S.prefs.density === "compact" ? "compact" : "comfortable");
  r.setAttribute("data-motion", S.prefs.motion === "system" ? "system" : S.prefs.motion);
  startBg();
}
let bgRaf = 0, bgPts = null;
function startBg() {
  const c = $("#bg"); if (!c) return;
  cancelAnimationFrame(bgRaf);
  const ctx = c.getContext("2d");
  c.style.display = S.prefs.bg ? "block" : "none";
  if (!S.prefs.bg) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const W = c.width = Math.floor(innerWidth * dpr), H = c.height = Math.floor(innerHeight * dpr);
  const n = innerWidth < 700 ? 28 : 52;
  bgPts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .22 * dpr, vy: (Math.random() - .5) * .22 * dpr }));
  const link = 150 * dpr;
  function frame(move) {
    ctx.clearRect(0, 0, W, H);
    for (const p of bgPts) {
      if (move) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
      ctx.fillStyle = "rgba(217,164,65,.55)"; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5 * dpr, 0, 6.283); ctx.fill();
    }
    for (let i = 0; i < bgPts.length; i++) for (let j = i + 1; j < bgPts.length; j++) {
      const a = bgPts[i], b = bgPts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < link) { ctx.strokeStyle = "rgba(159,183,196," + (0.16 * (1 - d / link)).toFixed(3) + ")"; ctx.lineWidth = dpr; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
  }
  if (!motionOn()) { frame(false); return; }
  (function loop() { if (!document.hidden) frame(true); bgRaf = requestAnimationFrame(loop); })();
}

/* CashAddr checksum (format and checksum only; says nothing about whether the address is funded or owned by anyone) */
function cashaddrValid(addr) {
  const m = /^(bitcoincash|bchtest|bchreg):([qpzry9x8gf2tvdw0s3jn54khce6mua7l]{42})$/.exec(String(addr).trim().toLowerCase());
  if (!m) return false;
  const CH = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
  const G = [0x98f2bc8e61n, 0x79b76d99e2n, 0xf33e5fb3c4n, 0xae2eabe2a8n, 0x1e4f43e470n];
  const vals = []; for (const ch of m[1]) vals.push(ch.charCodeAt(0) & 31); vals.push(0); for (const ch of m[2]) vals.push(CH.indexOf(ch));
  let c = 1n;
  for (const d of vals) { const c0 = c >> 35n; c = ((c & 0x07ffffffffn) << 5n) ^ BigInt(d); for (let i = 0; i < 5; i++) if ((c0 >> BigInt(i)) & 1n) c ^= G[i]; }
  return (c ^ 1n) === 0n;
}

    if (!int(W.refillPerBlock) || Number(W.refillPerBlock) < 0) e.refillPerBlock = "Enter a whole number of sats, 0 or more.";
    if (!e.perTxCap && !e.bucketCap && Number(W.perTxCap) > Number(W.bucketCap)) e.perTxCap = "The per-payment cap cannot exceed the budget cap.";
    if (!e.maxFee && !e.perTxCap && Number(W.maxFee) > Number(W.perTxCap)) e.maxFee = "A fee cap above the payment cap makes no sense.";
    if (!e.funding && !e.perTxCap && Number(W.funding) < Number(W.perTxCap) + Number(W.maxFee || 0)) e.funding = "Fund at least one maximum payment plus the fee cap.";
    if (!int(W.expiryDays) || Number(W.expiryDays) < 1 || Number(W.expiryDays) > 365) e.expiryDays = "Choose 1 to 365 days.";

}

  didx().forEach(p => { const low = p.text.toLowerCase(); if (terms.every(t => low.includes(t) || p.t.toLowerCase().includes(t))) { const i = Math.max(0, low.indexOf(terms[0]) - 40); out.push('<a href="#' + p.k + '"><b>' + esc(p.t) + '</b><br><small class="muted">…' + esc(p.text.slice(i, i + 110)) + "…</small></a>"); } });
  return out.length ? out.join("") : '<span class="muted" style="padding:6px 10px;font-size:.9rem">No page mentions that. Try a shorter word.</span>';
}
DOCP.forEach(([k, t], i) => reg(k, t === "Overview" ? "Docs" : t, "marketing", n => {
  const prev = DOCP[i - 1], next = DOCP[i + 1];
  return marketingShell(n, '<div class="wrap"><div class="docs"><aside><label class="field sr-label"><span class="sr">Search the docs</span><input type="search" data-q placeholder="Search the docs" aria-label="Search the docs"></label><nav aria-label="Docs" id="dres-wrap"><div id="dres" style="display:grid;gap:2px"></div>' + DOCP.map(([kk, tt]) => '<a href="#' + kk + '"' + (kk === n ? ' aria-current="page"' : "") + ">" + tt + "</a>").join("") + '</nav></aside><article class="doc" style="min-width:0">' + DOCB[k]() +
    '<div class="pager">' + (prev ? '<a href="#' + prev[0] + '"><small>Previous</small>' + prev[1] + "</a>" : "<span></span>") + (next ? '<a class="next" href="#' + next[0] + '"><small>Next</small>' + next[1] + "</a>" : "<span></span>") + "</div></article></div></div>");
}));
document.addEventListener("input", e => { if (e.target.hasAttribute && e.target.hasAttribute("data-q")) { const r = $("#dres"); if (r) r.innerHTML = docsSearch(e.target.value); } });

/* ---------- FAQ ---------- */
const FAQ = [
  ["What is Allowance Vault?", "A Bitcoin Cash covenant, meaning a coin whose spending rules are part of the coin. It lets an AI agent, bot or device hold a key that can only spend within a per-payment cap, a refilling budget, an approved recipient list and an expiry."],
  ["Is it live on mainnet?", "No. The covenant compiles and passes nine tests in a local emulator, but it is not deployed on any chain and not audited. A mainnet vault with a small balance is the next goal and is not started. Everything you can try here runs on a reference model in your browser."],
  ["What happens if the agent key leaks?", "The thief can only do what the rules allow: pay approved recipients, up to the cap, inside the budget. The wizard's review shows the exact worst case for your settings. The owner can then revoke."],
  ["Can the agent drain the vault?", "Not past the budget. It cannot change the recipients, the caps, the expiry or where the change goes, and the fee is capped and counted inside the budget."],
  ["How does the budget refill?", "It is a token bucket. The bucket holds up to the budget cap and gains a fixed number of sats per block. A fixed daily window would allow nearly double spending at a boundary. A bucket does not."],
  ["How does the owner revoke?", "The owner spends the vault output with the owner key, usually back to their own address. After that the agent has nothing to spend. Bitcoin Cash has no replace-by-fee, so the owner can also chain a spend on top of an unconfirmed agent transaction."],
  ["What if the owner key leaks?", "Then everything can be taken. The vault protects against agent-key loss, not owner-key loss. Keep the owner key offline or behind a multisig."],
  ["Why a covenant and not software limits?", "A limit enforced by the program that holds the key disappears when the key leaks. A limit in the script is checked by every node, whatever program signed the transaction."],
  ["Does it work with tokens such as stablecoins?", "Not in the first version. A vault output holds one NFT and fungible tokens of one category, so a token vault needs a second output. BCH comes first and tokens are planned."],
  ["Can I run several agents?", "Give each agent its own vault. One vault is one output, so spends are serialized. Separate vaults avoid agents blocking each other and keep their budgets separate."],
  ["How do I know a rejection was real?", "A rejected transaction has no transaction id. On a real chain the proof is the raw transaction, the node's rejection message, the unspent outpoint and a control that succeeds. Today the Lab shows the reference model's verdicts, labelled as simulated."],
  ["Which wallets will work?", "That is undecided. A wallet has to sign a covenant input. The options are WizardConnect or an XO template. The Connect wallet button stays disabled until one exists."],
  ["Has it been audited?", "No. Nobody has reviewed the contract. Do not put money in it that you cannot afford to lose, and treat every claim here as unproven."],
  ["How would I use it with my agent framework?", "Through a TypeScript SDK that is planned and not published. The SDK sketch shows the intended shape. Today you can read the contract and try the rules in the Lab."],
];
reg("faq", "FAQ", "marketing", n => marketingShell(n, '<div class="wrap" style="padding-top:clamp(30px,6vw,64px);max-width:820px"><h1>Questions, answered plainly</h1><p class="muted" style="margin:12px 0 28px">Where the honest answer is "not yet", it says so.</p><div class="faq">' + FAQ.map((f, i) => "<details" + (i === 1 ? " open" : "") + "><summary>" + esc(f[0]) + "</summary><div>" + esc(f[1]) + "</div></details>").join("") + '</div><div class="callout" style="margin-top:28px">Still unsure? <a href="#app-security">Try to break the vault</a> and see which rule stops you.</div></div>'));

reg("preferences", "Preferences", "app", n => appShell(n, [["app", "Overview"], ["preferences", "Preferences"]],
  '<div class="tabs"><a href="#preferences" aria-current="page">Preferences</a><a href="#preferences-security">Security</a></div><div class="panel" style="max-width:720px">' +
  '<div class="switch"><div class="t"><label for="p-density">Density</label><small>How tightly the app lays out rows and buttons.</small></div><select id="p-density" data-p="density"><option value="comfortable"' + (S.prefs.density === "comfortable" ? " selected" : "") + '>Comfortable</option><option value="compact"' + (S.prefs.density === "compact" ? " selected" : "") + ">Compact</option></select></div>" +
  '<div class="switch"><div class="t"><label for="p-motion">Motion</label><small>System follows your device setting for reduced motion.</small></div><select id="p-motion" data-p="motion"><option value="system"' + (S.prefs.motion === "system" ? " selected" : "") + '>Follow system</option><option value="reduce"' + (S.prefs.motion === "reduce" ? " selected" : "") + '>Reduce</option><option value="full"' + (S.prefs.motion === "full" ? " selected" : "") + ">Full</option></select></div>" +
  sw("bg", "Animated background", "A slow network of dots behind the page. Turn off to save battery.") + sw("labDetail", "Show all checks in the Lab", "List every rule check under each result, not only the one that failed.") +
  '<div class="switch"><div class="t"><label for="p-net">Network</label><small>Only simulation exists. Chipnet and mainnet are planned.</small></div><select id="p-net" disabled><option>Simulation</option></select></div></div>',
  pageHead("Preferences", "Saved in this browser only.")));
reg("preferences-security", "Security settings", "app", n => appShell(n, [["app", "Overview"], ["preferences", "Preferences"], ["preferences-security", "Security"]],
  '<div class="tabs"><a href="#preferences">Preferences</a><a href="#preferences-security" aria-current="page">Security</a></div><div class="panel" style="max-width:720px">' +
  sw("confirmRevoke", "Confirm before destructive actions", "Ask before revoking a vault or deleting a preview or an agent.") + sw("hideAmounts", "Hide amounts", "Mask sat values on screen, for screen sharing.") + "</div>" +
  '<div class="panel" style="max-width:720px;display:grid;gap:10px"><h3>Key handling</h3><p class="muted">This app has no field that accepts a seed phrase or private key, and it stores none. Agents keep their own keys. Wallet connection is planned, so there is nothing to disconnect yet.</p></div>' +
  '<div class="panel" style="max-width:720px;display:grid;gap:12px"><h3>Local data</h3><p class="muted">Preview vaults, agent slots and preferences live in this browser. They are not sent anywhere.</p><div class="row"><button class="btn" data-a="exportData">Copy as JSON</button><button class="btn danger" data-a="wipe">Clear local data</button></div></div>',
  pageHead("Security settings", "Control what the app asks and shows.")));
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.p; if (!k) return;
  S.prefs[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; save(); applyPrefs(); if (k === "hideAmounts" || k === "labDetail") toast("Saved"); else toast("Saved");
});
actions.exportData = () => copyText(JSON.stringify({ prefs: S.prefs, vaults: S.vaults, agents: S.agents }, null, 2), "Local data copied");
actions.wipe = async () => {
  const ok = await confirmBox("Clear all local data?", "This deletes your preview vaults, agent slots and preferences from this browser. Nothing on-chain exists to be affected.", "Clear data", true);

};
